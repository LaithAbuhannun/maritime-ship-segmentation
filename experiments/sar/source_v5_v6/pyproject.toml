[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-ship-segmentation-study"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.3", "Pillow>=10,<12", "pycocotools>=2.0.7", "pandas>=2.2,<3", "matplotlib>=3.8", "PyYAML>=6", "scipy>=1.12", "clearml==2.1.12", "tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["sarstudy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
